name: PadBridge
options:
  bundleIdPrefix: dev.padbridge
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  PadBridge:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Shaders.metal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.padbridge.client
        PRODUCT_NAME: PadBridge
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      gatherCoverageData: false

