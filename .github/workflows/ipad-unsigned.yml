name: Build unsigned iPad IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ipad-client/**"
      - ".github/workflows/ipad-unsigned.yml"

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ipad-client
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build device app without signing
        run: >-
          xcodebuild
          -project PadBridge.xcodeproj
          -scheme PadBridge
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PadBridge.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload PadBridge-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PadBridge-unsigned-ipa
          path: ipad-client/PadBridge-unsigned.ipa
          if-no-files-found: error
